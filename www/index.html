function tOf(o,k){const P=pts(o).sort((x,y)=>x[1]-y[1]);for(let j=0;j<P.length-1;j++){const[a,x]=P[j],[b,y]=P[j+1];if(k>=x&&k<=y)return y==x?a:a+(k-x)/(y-x)*(b-a)}return o.s}
