const NT=()=>{try{return window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()?Capacitor.Plugins.TextToSpeech:null}catch(e){return null}};
let LC={},SQ=0;
async function nlang(l){if(LC[l])return LC[l];const T=NT(),c=l=="ar"?["ar-SA","ar"]:["bn-BD","bn-IN","bn"];for(const x of c){try{const r=await T.isLanguageSupported({lang:x});if(r&&r.supported)return LC[l]=x}catch(e){}}return c[0]}
function toast(m){let t=$("#ts");if(!t){t=document.createElement("div");t.id="ts";t.style.cssText="position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#b3392f;color:#fff;padding:12px 14px;border-radius:12px;z-index:99;font-size:.95rem;text-align:center";document.body.appendChild(t)}t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",7000)}
function stopS(){SQ++;try{const T=NT();if(T)T.stop();else speechSynthesis.cancel()}catch(e){}}
async function speakList(list,done){
 const q=++SQ,T=NT(),sf=VP.soft!==false;
 if(T){let err=false;try{await T.stop()}catch(e){}
  for(const it of list){if(q!=SQ)return;try{const lang=await nlang(it.l);await T.speak({text:it.t,lang,rate:sf?it.r*.9:it.r,pitch:sf?1.1:1,volume:sf?.9:1,category:"playback",queueStrategy:0})}catch(e){if(q!=SQ)return;err=true;toast(it.l=="ar"?"আরবি ভয়েস পাওয়া যায়নি। ফোনের Settings → Text-to-speech-এ আরবি ভাষা/ভয়েস ইনস্টল করুন।":"বাংলা ভয়েস পাওয়া যায়নি। ফোনের Settings → Text-to-speech-এ বাংলা ভাষা/ভয়েস ইনস্টল করুন।");break}}
  if(q!=SQ)return;if(err){G.on=false;if(tab=="goj")ctrl();return}if(done)done();return}
 try{const S=speechSynthesis;S.cancel();let fin=false;const ex=()=>{if(fin||q!=SQ)return;fin=true;done&&done()};list.forEach((it,k)=>{const u=mkU(it.t,it.l,it.r);if(k==list.length-1){u.onend=ex;u.onerror=ex}S.speak(u)})}catch(e){toast("এই ডিভাইসে ভয়েস সাপোর্ট নেই");if(done)setTimeout(done,3000)}
}
function say(d,withBn){speakList([{t:d.a,l:"ar",r:.7},...(withBn?[{t:d.m,l:"bn",r:.9}]:[])])}
const bn=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
const $=s=>document.querySelector(s),V=$("#v");
let tab="list",hideM=false,filt="all",ci=0,flip=false,Q=null;
function prog(){const p=done.size;$("#pb").style.width=p/99*100+"%";$("#pt").textContent=`${bn(p)}/৯৯ নাম মুখস্থ হয়েছে`}
function list(){
 const items=D.filter(d=>filt=="all"||(filt=="todo"?!done.has(d.i):done.has(d.i)));
 V.innerHTML=`<div class="tools"><button id="h">${hideM?"অর্থ দেখান":"অর্থ লুকান"}</button><button id="f">${{all:"সব নাম",todo:"বাকি আছে",done:"মুখস্থ হয়েছে"}[filt]}</button></div>`+
 items.map(d=>`<div class="row${hideM?" hide":""}"><div class="n">${bn(d.i)}</div><div class="ar">${d.a}</div><div class="t"><b>${d.t}</b><span>${d.m}</span></div><button class="chk${done.has(d.i)?" on":""}" data-i="${d.i}" aria-label="মুখস্থ চিহ্নিত করুন">${done.has(d.i)?"✓":""}</button></div>`).join("")||`<p class="sub">এখানে কিছু নেই।</p>`;
 $("#h").onclick=()=>{hideM=!hideM;list()};
 $("#f").onclick=()=>{filt={all:"todo",todo:"done",done:"all"}[filt];list()};
 V.querySelectorAll(".chk").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;done.has(i)?done.delete(i):done.add(i);save();prog();list()});
 V.querySelectorAll(".row").forEach((r,k)=>r.onclick=e=>{if(e.target.closest(".chk"))return;const sp=r.querySelector("span"),was=r.classList.contains("hide")&&sp.style.filter!=="none";if(r.classList.contains("hide"))sp.style.filter="none";say(items[k],!was)});
}
function card(){
 const d=D[ci];
 V.innerHTML=`<div class="fc" id="fc" tabindex="0"><small>${bn(d.i)} / ৯৯</small><div class="ar">${d.a}</div><div class="tr">${flip?d.t:"&nbsp;"}</div><div class="mn">${flip?d.m:"&nbsp;"}</div><small>${flip?"":"ট্যাপ করলে নাম ও অর্থ শোনা যাবে"}</small></div>
 <div class="ctl"><button class="btn" id="pv">আগের</button><button class="btn p" id="mk">${done.has(d.i)?"✓ মুখস্থ":"মুখস্থ হয়েছে"}</button><button class="btn" id="nx">পরের</button></div>`;
 $("#fc").onclick=()=>{flip=!flip;card();say(d,flip)};
 $("#pv").onclick=()=>{ci=(ci+98)%99;flip=false;card()};
 $("#nx").onclick=()=>{ci=(ci+1)%99;flip=false;card()};
 $("#mk").onclick=()=>{done.has(d.i)?done.delete(d.i):done.add(d.i);save();prog();card()};
}
function quiz(reset){
 if(reset||!Q)Q={s:0,n:0};
 const pool=D.filter(d=>done.size>=4?done.has(d.i):true);
 const d=pool[Math.floor(Math.random()*pool.length)];
 const o=[d];while(o.length<4){const x=D[Math.floor(Math.random()*99)];if(!o.includes(x))o.push(x)}
 o.sort(()=>Math.random()-.5);
 V.innerHTML=`<div class="score"><span>সঠিক: ${bn(Q.s)}/${bn(Q.n)}</span><span>${done.size>=4?"শুধু মুখস্থ নাম থেকে":"সব নাম থেকে"}</span></div><div class="q"><div class="ar">${d.a}</div><p class="sub">এর অর্থ কোনটি? (আরবিতে ট্যাপ করলে শোনা যাবে)</p><div class="opts">${o.map(x=>`<button data-i="${x.i}">${x.m}</button>`).join("")}</div></div>`;
 V.querySelector(".q .ar").onclick=()=>say(d,false);
 V.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{
  const ok=+b.dataset.i==d.i;Q.n++;if(ok)Q.s++;
  V.querySelectorAll(".opts button").forEach(x=>{x.disabled=true;if(+x.dataset.i==d.i)x.classList.add("ok")});
  if(!ok)b.classList.add("no");
  setTimeout(()=>quiz(),ok?700:1600);
 });
}
const G={m:"v",i:0,on:false,s:0,e:0,r:.7,b:false,an:[],sy:false};
function stopG(){G.on=false;clearTimeout(G.t);stopS();if(G.a)G.a.pause()}
function cur(i){G.i=i;const c=$("#gl");if(!c)return;const rs=c.querySelectorAll(".gr"),r=rs[i],d=D[i];rs.forEach((x,k)=>x.classList.toggle("on",k==i));c.scrollTo({top:r.offsetTop-c.clientHeight/2+r.offsetHeight/2,behavior:"smooth"});$("#gh").innerHTML=`<div class="ar">${d.a}</div><b>${d.t}</b><span>${d.m}</span>`}
function vstep(){if(!G.on)return;const i=G.i,d=D[i];cur(i);let fin=false;const nx=()=>{if(fin||!G.on)return;fin=true;clearTimeout(G.t);G.t=setTimeout(()=>{G.i=(i+1)%99;vstep()},600)};speakList([{t:d.a,l:"ar",r:G.r},...(G.b?[{t:d.m,l:"bn",r:.9}]:[])],nx);G.t=setTimeout(nx,15000)}
function asv(){try{localStorage.setItem("asma-an",JSON.stringify(G.an))}catch(e){}}
function pts(){const e=G.e||(G.a&&G.a.duration)||1;return [[G.s,0],...(G.bi?G.an:[]),[e,99]].sort((x,y)=>x[0]-y[0])}
function idxAt(t){const P=pts();for(let j=0;j<P.length-1;j++){const[t0,k0]=P[j],[t1,k1]=P[j+1];if(t>=t0&&t<t1)return Math.max(0,Math.min(98,Math.floor(k0+(t-t0)/(t1-t0)*(k1-k0))))}return t<P[0][0]?0:98}
function tOf(k){const P=pts().sort((x,y)=>x[1]-y[1]);for(let j=0;j<P.length-1;j++){const[t0,k0]=P[j],[t1,k1]=P[j+1];if(k>=k0&&k<=k1)return k1==k0?t0:t0+(k-k0)/(k1-k0)*(t1-t0)}return G.s}
function addAn(k){const t=G.a.currentTime;let A=G.an.filter(x=>Math.abs(x[0]-t)>1&&x[1]!=k);A.push([t,k]);A.sort((x,y)=>x[0]-y[0]);G.an=A.filter((x,j)=>j==0||x[1]>A[j-1][1]);asv();cur(k);ctrl()}
function setA(x){x.loop=true;x.onloadedmetadata=()=>{if(!G.bi){G.e=Math.floor(x.duration);G.s=0}ctrl()};x.onplay=x.onpause=ctrl;x.ontimeupdate=()=>{if(tab!="goj"||G.m!="a")return;const i=idxAt(x.currentTime);if(i!=G.i)cur(i)};G.a=x;ctrl()}
function initA(){if(G.a)return;G.bi=true;G.s=27;G.e=321;try{G.an=JSON.parse(localStorage.getItem("asma-an")||"[]")}catch(e){}setA(new Audio(AUD))}
function ctrl(){
 const a=G.a,pl=G.m=="v"?G.on:(a&&!a.paused);
 let h=`<button class="btn p" id="gp">${pl?"⏸ থামুন":"▶ চালু করুন"}</button>`;
 if(G.m=="v")h+=`<select id="gs" class="btn"><option value=".5">ধীর</option><option value=".7">মাঝারি</option><option value="1">দ্রুত</option></select><label><input type="checkbox" id="gb"${G.b?" checked":""}> বাংলা অর্থসহ</label><label><input type="checkbox" id="gt"${VP.soft!==false?" checked":""}> নরম সুর</label>${NT()?"":`<select id="va" class="btn">${vopt("ar")}</select><select id="vb" class="btn">${vopt("bn")}</select>`}`;
 else h+=`<label class="btn">অন্য অডিও <input type="file" id="gf" accept="audio/*" hidden></label>`+(a?`<label>শুরু(সে.) <input type="number" id="g0" min="0" value="${G.s}"></label><label>শেষ(সে.) <input type="number" id="g1" min="1" value="${G.e}"></label><button class="btn${G.sy?" p":""}" id="gy">📍 সিঙ্ক ঠিক করুন</button>${G.an.length?`<button class="btn" id="gr">রিসেট</button>`:""}<small style="flex-basis:100%;color:var(--mute)">${G.sy?"গজল চলার সময় যে নামটি শুনছেন সেটিতে ট্যাপ করুন। এতে সেই সময়টি ওই নামের সাথে মেলানো থাকবে (সংরক্ষিত: "+bn(G.an.length)+"টি)।":"নামে ট্যাপ করলে গজল সেখানে চলে যাবে।"}</small>`:"");
 $("#gc").innerHTML=h;
 $("#gp").onclick=()=>{if(G.m=="v"){if(G.on)stopG();else{G.on=true;vstep()}}else if(a){a.paused?a.play():a.pause()}ctrl()};
 if(G.m=="v"){$("#gs").value=G.r;$("#gs").onchange=e=>G.r=+e.target.value;$("#gb").onchange=e=>G.b=e.target.checked;$("#gt").onchange=e=>{VP.soft=e.target.checked;vsave();say(D[G.i],true)};if($("#va"))$("#va").onchange=e=>{VP.ar=e.target.value;vsave();say(D[G.i],false)};if($("#vb"))$("#vb").onchange=e=>{VP.bn=e.target.value;vsave();say(D[G.i],true)}}
 else{$("#gf").onchange=e=>{const f=e.target.files[0];if(!f)return;stopG();G.bi=false;setA(new Audio(URL.createObjectURL(f)))};
  if(a){$("#g0").onchange=e=>G.s=+e.target.value||0;$("#g1").onchange=e=>G.e=+e.target.value||0;$("#gy").onclick=()=>{G.sy=!G.sy;ctrl()};if($("#gr"))$("#gr").onclick=()=>{G.an=[];asv();ctrl()}}}
}
function goj(){
 V.innerHTML=`<div class="tools"><button id="m1" class="btn${G.m=="v"?" p":""}">ভয়েস পাঠ</button><button id="m2" class="btn${G.m=="a"?" p":""}">গজল (অডিও)</button></div><div class="gh" id="gh"><small>চালু করলে নামগুলো একে একে অটো স্ক্রল হবে</small></div><div class="gc" id="gc"></div><div class="gl" id="gl">${D.map((d,k)=>`<div class="gr" data-k="${k}"><span class="n">${bn(d.i)}</span><span class="ar">${d.a}</span><b>${d.t}</b></div>`).join("")}</div>`;
 $("#m1").onclick=()=>{stopG();G.m="v";goj()};$("#m2").onclick=()=>{stopG();G.m="a";initA();goj()};
 V.querySelectorAll(".gr").forEach(r=>r.onclick=()=>{const k=+r.dataset.k;if(G.m=="a"&&G.a){if(G.sy&&G.bi)addAn(k);else{G.a.currentTime=tOf(k);cur(k)}}else if(G.m=="v"&&G.on){G.i=k;vstep()}else{cur(k);say(D[k],true)}});
 if(G.m=="a")initA();ctrl();cur(G.i);
}
const R={list,card,quiz,goj};
function go(t){stopG();tab=t;document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t==t));R[t]();scrollTo(0,0)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.t));
prog();go("list");
try{if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js")}catch(e){}
</script>
</body>
</html>
