name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: Install app icons
        run: |
          cp -r android-res/. android/app/src/main/res/
          rm -f android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml
      - name: Allow TTS engine lookup (Android 11+)
        run: |
          python3 - <<'PY'
          p="android/app/src/main/AndroidManifest.xml"
          s=open(p,encoding="utf8").read()
          q='<queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>'
          if "TTS_SERVICE" not in s:
              s=s.replace("</manifest>",q+"</manifest>")
          open(p,"w",encoding="utf8").write(s)
          PY
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: asmaul-husna-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
